# Copy outside the checkout and fill in your own settings. No credential values.
user: your-profile
org: your-workspace-id
provider: codex
# Interactive T3 UI. Use backend: native for the original runner / native Claude.
backend: t3
# Unique private HTTPS origin for this task UI service. Set before dispatch.
# t3_public_url: https://your-bot.your-tailnet.ts.net:8443
# On Linux amd64 the installed controller is also the guest helper. On a Mac:
# GOOS=linux GOARCH=amd64 go build -o bin/codex-remote-linux .
# guest_binary: /absolute/path/to/bin/codex-remote-linux
repo: owner/repo
base: main
vcpus: 2
mem_mib: 4096
# Paid plans: 5m backup idle pause. Free: use 30m and its allowed VM size.
auto_suspend: 5m
# Existing Instabox Secret names only. Select GH_TOKEN for a private GitHub repo.
secrets: []
# secrets: [GH_TOKEN]
# Optional clean tool/dependency snapshot, without credentials or private work:
# snapshot: your-clean-base

# Headless bot host. init-key generates a new private key once; do not replace it.
credential_backend: encrypted-file
credential_key_file: "~/.config/codex-remote-runner-keys/master.key"
# For desktop storage, set credential_backend: native and remove credential_key_file.
# Configuration and recovery: docs/operations.md
